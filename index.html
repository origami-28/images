<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像解像度・印刷サイズチェッカー</title>
<style>
    body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        padding: 20px;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
        font-size: 1.4rem;
        border-bottom: 2px solid #007bff;
        padding-bottom: 10px;
        margin-top: 0;
    }
    .tabs {
        display: flex;
        margin-bottom: 15px;
    }
    .tab {
        flex: 1;
        text-align: center;
        padding: 10px;
        background: #eee;
        cursor: pointer;
        border: 1px solid #ddd;
    }
    .tab.active {
        background: #007bff;
        color: #fff;
        font-weight: bold;
        border-color: #007bff;
    }
    .input-section {
        display: none;
        padding: 15px 0;
    }
    .input-section.active {
        display: block;
    }
    input[type="text"], input[type="file"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        margin-bottom: 10px;
    }
    button {
        background: #28a745;
        color: #fff;
        border: none;
        padding: 10px 20px;
        font-size: 1rem;
        border-radius: 4px;
        cursor: pointer;
    }
    button:hover { background: #218838; }
    
    .error { color: #dc3545; font-weight: bold; margin-top: 10px; display: none; }
    
    .result-area {
        margin-top: 25px;
        display: none;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    th, td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
    }
    th { background: #f8f9fa; }
    .img-preview {
        max-width: 100%;
        max-height: 200px;
        margin-top: 10px;
        border: 1px solid #ddd;
    }
</style>
</head>
<body>

<div class="container">
    <h1>画像解像度・印刷サイズチェッカー</h1>
    
    <!-- タブ切り替え -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('file')">ファイルから読み込む</div>
        <div class="tab" onclick="switchTab('url')">URLから読み込む</div>
    </div>

    <!-- ファイル入力 -->
    <div id="section-file" class="input-section active">
        <label>画像ファイルを選択 (JPG, PNG等)</label>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- URL入力 -->
    <div id="section-url" class="input-section">
        <label>画像のURLを入力</label>
        <input type="text" id="urlInput" placeholder="https://example.com/image.jpg">
        <button onclick="loadImageFromUrl()">URLから読み込む</button>
    </div>

    <div id="errorMsg" class="error"></div>

    <!-- 結果表示エリア -->
    <div id="resultArea" class="result-area">
        <h3>画像情報</h3>
        <p><strong>ピクセルサイズ：</strong> <span id="pxWidth">0</span> px × <span id="pxHeight">0</span> px</p>
        <img id="previewImg" class="img-preview" src="" alt="プレビュー">

        <h3>出力解像度ごとの印刷寸法目安</h3>
        <table>
            <tr>
                <th>解像度 (DPI)</th>
                <th>用途の目安</th>
                <th>印刷サイズ (幅 × 高さ)</th>
            </tr>
            <tbody id="resultTableBody">
                <!-- 計算結果がここに入ります -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // タブ切り替え処理
    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.input-section').forEach(el => el.classList.remove('active'));
        
        if (type === 'file') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('section-file').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('section-url').classList.add('active');
        }
        hideError();
    }

    // エラー非表示
    function hideError() {
        document.getElementById('errorMsg').style.display = 'none';
    }
    // エラー表示
    function showError(msg) {
        const errEl = document.getElementById('errorMsg');
        errEl.innerText = msg;
        errEl.style.display = 'block';
        document.getElementById('resultArea').style.display = 'none';
    }

    // 1. ファイル入力時の処理
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        if (!file.type.match('image.*')) {
            showError("画像ファイルを選択してください。");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
            processImage(event.target.result);
        };
        reader.readAsDataURL(file);
    });

    // 2. URL入力時の処理
    function loadImageFromUrl() {
        const url = document.getElementById('urlInput').value;
        if (!url) {
            showError("URLを入力してください。");
            return;
        }
        processImage(url);
    }

    // 3. 画像の読み込みとサイズ計算（共通処理）
    function processImage(src) {
        hideError();
        const img = new Image();
        
        // URL読み込み時のCORSエラー対策（許可されているサーバーのみ有効）
        img.crossOrigin = "Anonymous"; 

        img.onload = function() {
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            
            document.getElementById('pxWidth').innerText = w;
            document.getElementById('pxHeight').innerText = h;
            document.getElementById('previewImg').src = img.src;
            
            calculatePrintSizes(w, h);
            document.getElementById('resultArea').style.display = 'block';
        };
        
        img.onerror = function() {
            showError("画像の読み込みに失敗しました。URLが間違っているか、外部サイトからの読み込み(CORS)がブロックされています。");
        };
        
        img.src = src;
    }

    // 4. 印刷寸法の計算
    function calculatePrintSizes(pxWidth, pxHeight) {
        const tbody = document.getElementById('resultTableBody');
        tbody.innerHTML = ""; // クリア
        
        // 検証するDPIリスト
        const dpis = [
            { dpi: 350, desc: "商業印刷・チラシ (高画質)" },
            { dpi: 200, desc: "A型看板・ポスター" },
            { dpi: 150, desc: "バナースタンド・タペストリー" },
            { dpi: 100, desc: "のぼり旗・野立て看板 (遠目用)" }
        ];

        dpis.forEach(item => {
            // cm = (ピクセル数 / dpi) * 2.54
            const cmWidth = ((pxWidth / item.dpi) * 2.54).toFixed(1);
            const cmHeight = ((pxHeight / item.dpi) * 2.54).toFixed(1);
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.dpi} dpi</strong></td>
                <td>${item.desc}</td>
                <td>${cmWidth} cm × ${cmHeight} cm</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
